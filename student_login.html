
<!DOCTYPE html>
<html>
<head>
    <title>Student Login - LabPulse</title>

    <style>
        body {
            background: #f3f6fb;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 40px;
            width: 330px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #dce3ee;
        }

        h2 {
            color: #2563eb;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        .message {
            color: red;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>⚡ LabPulse</h2>
    <h3>Student Login</h3>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input type="text"
               name="login_id"
               placeholder="Roll Number or Email"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>New Student?
        <a href="{{ url_for('student_register') }}">
            Register Here
        </a>
    </p>

</div>

</body>
</html>
